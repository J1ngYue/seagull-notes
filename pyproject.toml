[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seagull-notes"
version = "0.1.0"
description = "视频/文章 → 结构化 Markdown 笔记 + 脑图，通过 MCP 暴露给 AI 客户端"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2024.1.1",
    "httpx>=0.27",
    "lxml>=5.0",
    "readability-lxml>=0.8.1",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
mcp = ["mcp>=2.3"]
asr = ["faster-whisper>=1.0", "huggingface_hub>=0.23"]
notes = ["Markdown>=3.5"]
test = ["pytest>=7"]
png = ["playwright>=1.40"]

[project.scripts]
seagull-notes = "seagull_notes.cli:main"
seagull-notes-mcp = "seagull_notes.server:main"

[tool.setuptools.packages.find]
where = ["src"]
