[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seagull-notes"
version = "0.1.0"
description = "A Codex skill that turns Bilibili, YouTube, and local media into illustrated notes, mind maps, and offline HTML. Captions first, with optional local transcription."
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2024.1.1",
    "httpx>=0.27",
    "lxml>=5.0",
    "readability-lxml>=0.8.1",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
mcp = ["mcp>=2.3"]
asr = ["faster-whisper>=1.0", "huggingface_hub>=0.23"]
notes = ["Markdown>=3.6", "pymdown-extensions>=10"]
plots = ["matplotlib>=3.9"]
browser = ["playwright>=1.40"]
test = ["pytest>=7"]
png = ["playwright>=1.40"]

[project.scripts]
seagull-notes = "seagull_notes.cli:main"
seagull-notes-mcp = "seagull_notes.server:main"

[tool.setuptools.packages.find]
where = ["src"]
