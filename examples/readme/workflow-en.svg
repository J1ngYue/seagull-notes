<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="630" viewBox="0 0 1600 630" role="img" aria-labelledby="title desc"><title id="title">From material to a notebook you can study</title><desc id="desc">Three inputs feed AI research and writing, followed by reading, practice, mapping and export.</desc><g font-family="Segoe UI,Microsoft YaHei,Arial,sans-serif"><rect x="1" y="1" width="1598" height="628" rx="22" fill="#faf9f5" stroke="#e5dfd3"/><text x="60" y="64" font-size="34" fill="#302c29" font-weight="650">A learning workflow, from start to saved.</text><text x="62" y="104" font-size="19" fill="#7c7065" >Collect real material → Research &amp; write → Read, revisit, and keep</text><rect x="60" y="162" width="393" height="101" rx="13" fill="#fffefa" stroke="#e3d9ca"/><text x="82" y="199" font-size="16" fill="#b08b68" font-weight="700">01</text><text x="123" y="200" font-size="23" fill="#3b332a" font-weight="600">A topic</text><text x="123" y="233" font-size="16" fill="#7b7064" >Tell the AI what you want to learn</text><rect x="60" y="283" width="393" height="101" rx="13" fill="#fffefa" stroke="#e3d9ca"/><text x="82" y="320" font-size="16" fill="#b08b68" font-weight="700">02</text><text x="123" y="321" font-size="23" fill="#3b332a" font-weight="600">Text or a note URL</text><text x="123" y="354" font-size="16" fill="#7b7064" >Paste notes or share an article link</text><rect x="60" y="404" width="393" height="101" rx="13" fill="#fffefa" stroke="#e3d9ca"/><text x="82" y="441" font-size="16" fill="#b08b68" font-weight="700">03</text><text x="123" y="442" font-size="23" fill="#3b332a" font-weight="600">Video or local material</text><text x="123" y="475" font-size="16" fill="#7b7064" >Captions first; sign in only if needed</text><path d="M454 213h43q19 0 19 20v80m-62 20h79m-79 101h43q19 0 19-20v-80m0-20h40" fill="none" stroke="#c0ad94" stroke-width="2.5"/><path d="m546 307 10 7-10 7" fill="none" stroke="#c0ad94" stroke-width="2.5"/><rect x="575" y="193" width="453" height="290" rx="19" fill="#eee7dc" stroke="none"/><text x="605" y="236" font-size="14" fill="#927052" letter-spacing="2">YOUR AI CLIENT</text><text x="605" y="283" font-size="29" fill="#3b332a" font-weight="600">Read. Understand. Write.</text><text x="605" y="326" font-size="18" fill="#6f6256" >Explain ideas, examples, and sources.</text><text x="605" y="361" font-size="18" fill="#6f6256" >Author illustrations, quizzes, and maps.</text><rect x="604" y="398" width="393" height="49" rx="9" fill="#fffaf2" stroke="none"/><text x="623" y="429" font-size="16" fill="#7c654e" >Python helpers collect and render the notes.</text><path d="M1029 334h53" stroke="#a6b8ba" stroke-width="2.5"/><path d="m1073 327 10 7-10 7" fill="none" stroke="#a6b8ba" stroke-width="2.5"/><rect x="1105" y="162" width="435" height="101" rx="13" fill="#eef3f2" stroke="#d4dfde"/><text x="1130" y="200" font-size="23" fill="#355c64" font-weight="600">Read &amp; collect</text><text x="1130" y="234" font-size="17" fill="#627e82" >Seven styles · A personal shelf</text><rect x="1105" y="283" width="435" height="101" rx="13" fill="#eef3f2" stroke="#d4dfde"/><text x="1130" y="321" font-size="23" fill="#355c64" font-weight="600">Practice &amp; revisit</text><text x="1130" y="355" font-size="17" fill="#627e82" >Chapter quizzes · Mastery · Mind maps</text><rect x="1105" y="404" width="435" height="101" rx="13" fill="#eef3f2" stroke="#d4dfde"/><text x="1130" y="442" font-size="23" fill="#355c64" font-weight="600">Keep &amp; edit</text><text x="1130" y="476" font-size="17" fill="#627e82" >HTML · Markdown · Obsidian</text><path d="M60 553h1480" stroke="#e1d9cc"/><text x="60" y="594" font-size="14" fill="#7b7064" letter-spacing="2">TRACEABLE SOURCES  /  WORKING INTERACTIONS  /  EDITABLE EXPORTS</text></g></svg>
