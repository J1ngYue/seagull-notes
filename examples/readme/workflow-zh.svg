<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="630" viewBox="0 0 1600 630" role="img" aria-labelledby="title desc"><title id="title">从材料到可学习的笔记</title><desc id="desc">三种输入交给 AI 阅读与编写，再连接阅读、自测、导图与导出。</desc><g font-family="Segoe UI,Microsoft YaHei,Arial,sans-serif"><rect x="1" y="1" width="1598" height="628" rx="22" fill="#faf9f5" stroke="#e5dfd3"/><text x="60" y="64" font-size="34" fill="#302c29" font-weight="650">从一份材料，接上一条学习路线。</text><text x="62" y="104" font-size="19" fill="#7c7065" >收集真实材料 → 理解与编写 → 阅读、复习与带走</text><rect x="60" y="162" width="393" height="101" rx="13" fill="#fffefa" stroke="#e3d9ca"/><text x="82" y="199" font-size="16" fill="#b08b68" font-weight="700">01</text><text x="123" y="200" font-size="23" fill="#3b332a" font-weight="600">知识主题</text><text x="123" y="233" font-size="18" fill="#7b7064" >直接告诉 AI 你想学什么</text><rect x="60" y="283" width="393" height="101" rx="13" fill="#fffefa" stroke="#e3d9ca"/><text x="82" y="320" font-size="16" fill="#b08b68" font-weight="700">02</text><text x="123" y="321" font-size="23" fill="#3b332a" font-weight="600">文字或笔记链接</text><text x="123" y="354" font-size="18" fill="#7b7064" >粘贴笔记，或提供文章网址</text><rect x="60" y="404" width="393" height="101" rx="13" fill="#fffefa" stroke="#e3d9ca"/><text x="82" y="441" font-size="16" fill="#b08b68" font-weight="700">03</text><text x="123" y="442" font-size="23" fill="#3b332a" font-weight="600">视频与本地素材</text><text x="123" y="475" font-size="18" fill="#7b7064" >优先完整字幕；需要时扫码登录</text><path d="M454 213h43q19 0 19 20v80m-62 20h79m-79 101h43q19 0 19-20v-80m0-20h40" fill="none" stroke="#c0ad94" stroke-width="2.5"/><path d="m546 307 10 7-10 7" fill="none" stroke="#c0ad94" stroke-width="2.5"/><rect x="575" y="193" width="453" height="290" rx="19" fill="#eee7dc" stroke="none"/><text x="605" y="236" font-size="14" fill="#927052" letter-spacing="2">当前 AI 客户端</text><text x="605" y="283" font-size="29" fill="#3b332a" font-weight="600">读懂，再写下来。</text><text x="605" y="326" font-size="18" fill="#6f6256" >解释概念，保留重要例子与出处。</text><text x="605" y="361" font-size="18" fill="#6f6256" >编写配图、章节题目与多层导图。</text><rect x="604" y="398" width="393" height="49" rx="9" fill="#fffaf2" stroke="none"/><text x="623" y="429" font-size="17" fill="#7c654e" >Python 工具取素材并渲染，不代写教程</text><path d="M1029 334h53" stroke="#a6b8ba" stroke-width="2.5"/><path d="m1073 327 10 7-10 7" fill="none" stroke="#a6b8ba" stroke-width="2.5"/><rect x="1105" y="162" width="435" height="101" rx="13" fill="#eef3f2" stroke="#d4dfde"/><text x="1130" y="200" font-size="23" fill="#355c64" font-weight="600">阅读与收藏</text><text x="1130" y="234" font-size="18" fill="#627e82" >七种风格 · 个人笔记夹</text><rect x="1105" y="283" width="435" height="101" rx="13" fill="#eef3f2" stroke="#d4dfde"/><text x="1130" y="321" font-size="23" fill="#355c64" font-weight="600">练习与回看</text><text x="1130" y="355" font-size="18" fill="#627e82" >章末选择题 · 掌握标记 · 导图</text><rect x="1105" y="404" width="435" height="101" rx="13" fill="#eef3f2" stroke="#d4dfde"/><text x="1130" y="442" font-size="23" fill="#355c64" font-weight="600">带走与编辑</text><text x="1130" y="476" font-size="18" fill="#627e82" >HTML · Markdown · Obsidian</text><path d="M60 553h1480" stroke="#e1d9cc"/><text x="60" y="594" font-size="14" fill="#7b7064" letter-spacing="2">来源可核验  /  交互可操作  /  导出可编辑</text></g></svg>
