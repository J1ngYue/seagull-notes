<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850" role="img" aria-labelledby="title desc"><title id="title">Seagull Notes：七种阅读空间</title><desc id="desc">知识主题、文字与视频，整理为可阅读、复习与导出的图文笔记。产品概念示意图。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#faf8f2"/><stop offset="1" stop-color="#ece8df"/></linearGradient><linearGradient id="leather" x2="1" y2="1"><stop stop-color="#72553d"/><stop offset="1" stop-color="#402f25"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#453b30" flood-opacity=".13"/></filter></defs><g font-family="Segoe UI,Microsoft YaHei,Arial,sans-serif"><rect x="1" y="1" width="1598" height="848" rx="26" fill="url(#bg)" stroke="#e4ded1"/><path d="M62 77q15-19 30-3 15-16 30 3m-43 12q13 7 26 0" fill="none" stroke="#80634c" stroke-width="3.5" stroke-linecap="round"/><text x="142" y="86" font-size="26" fill="#302c29" font-weight="700" letter-spacing="3">SEAGULL NOTES</text><text x="1320" y="81" font-size="15" fill="#776e65" letter-spacing="3">CODEX SKILL</text><text x="66" y="197" font-size="53" fill="#302c29" font-weight="700" letter-spacing="-1.8">把理解，留在纸上。</text><text x="66" y="264" font-size="53" fill="#302c29" font-weight="700" letter-spacing="-1.8">把知识，带在身边。</text><text x="68" y="321" font-size="24" fill="#776e65" >从主题、文字和视频出发，</text><text x="68" y="360" font-size="24" fill="#776e65" >读懂、练习、回看，再自由导出。</text><rect x="68" y="407" width="221" height="42" rx="21" fill="#eee2d2" stroke="none"/><text x="90" y="434" font-size="14" fill="#81573e" font-weight="600" letter-spacing="1">图文笔记 × 学习工具</text><rect x="305" y="407" width="190" height="42" rx="21" fill="#e0e9ed" stroke="none"/><text x="327" y="434" font-size="14" fill="#456276" font-weight="600" letter-spacing="1">可编辑 · 可带走</text><g filter="url(#shadow)"><rect x="797" y="144" width="733" height="458" rx="20" fill="url(#leather)" stroke="none"/><rect x="808" y="155" width="711" height="436" rx="13" fill="none" stroke="#c39d71" stroke-dasharray="3 4" opacity=".5"/><rect x="818" y="168" width="690" height="395" rx="7" fill="#fffdf7" stroke="none"/><path d="M1163 169v392" stroke="#e1d6c2" stroke-width="8"/><path d="M1167 170v390" stroke="#f1eadd" stroke-width="5"/><text x="847" y="208" font-size="12" fill="#a37656" letter-spacing="2">学习笔记</text><text x="848" y="252" font-size="26" fill="#302c29" font-weight="600">从改动到协作</text><text x="848" y="286" font-size="26" fill="#302c29" font-weight="600">理解 Git 与 GitHub</text><text x="849" y="330" font-size="14" fill="#776e65" >先看差异，再决定提交什么。</text><text x="849" y="358" font-size="14" fill="#776e65" >用解释、例子与练习串起知识。</text><path d="M848 389h278" stroke="#e8dfcf"/><path d="M848 415h278" stroke="#e8dfcf"/><path d="M848 441h278" stroke="#e8dfcf"/><path d="M848 467h278" stroke="#e8dfcf"/><rect x="848" y="456" width="276" height="64" rx="6" fill="#f0e7d9" stroke="none"/><path d="m866 485 6 6 11-14" fill="none" stroke="#7d8b70" stroke-width="3" stroke-linecap="round"/><text x="894" y="490" font-size="14" fill="#5f6855" >掌握了，再做自己的标记。</text><text x="1198" y="209" font-size="12" fill="#648395" letter-spacing="1.8">把联系看清楚</text><path d="M1345 290v55m0 0-92 60m92-60 91 60m-91-60v132" fill="none" stroke="#acc4cf" stroke-width="2.5"/><rect x="1283" y="257" width="124" height="47" rx="9" fill="#e2edf0" stroke="none"/><text x="1345" y="287" font-size="19" fill="#385b70" text-anchor="middle" font-weight="600">Git</text><rect x="1197" y="391" width="112" height="44" rx="8" fill="#f3f6f5" stroke="#d4e0df"/><text x="1253" y="419" font-size="14" fill="#4d6c79" text-anchor="middle">改动</text><rect x="1371" y="391" width="112" height="44" rx="8" fill="#f3f6f5" stroke="#d4e0df"/><text x="1427" y="419" font-size="14" fill="#4d6c79" text-anchor="middle">提交</text><rect x="1283" y="465" width="124" height="44" rx="8" fill="#f3f6f5" stroke="#d4e0df"/><text x="1345" y="493" font-size="14" fill="#4d6c79" text-anchor="middle">协作</text></g><text x="800" y="644" font-size="12" fill="#776e65" letter-spacing="1.6">产品概念示意 · 真实界面见下方</text><path d="M68 510h650" stroke="#ded6c8"/><text x="68" y="553" font-size="24" fill="#302c29" font-weight="600">七种风格，同一份完整笔记。</text><text x="68" y="592" font-size="17" fill="#776e65" >章节自测 · 思维导图 · Markdown · Obsidian</text><rect x="66" y="703" width="199" height="71" rx="10" fill="#fffdf8" stroke="#dfd8cc"/><rect x="80" y="723" width="7" height="30" rx="3" fill="#b79572" stroke="none"/><text x="99" y="746" font-size="20" fill="#302c29" font-weight="600">米色纸页</text><rect x="278" y="703" width="199" height="71" rx="10" fill="#fffdf8" stroke="#dfd8cc"/><rect x="292" y="723" width="7" height="30" rx="3" fill="#a68a6c" stroke="none"/><text x="311" y="746" font-size="20" fill="#302c29" font-weight="600">手写札记</text><rect x="490" y="703" width="199" height="71" rx="10" fill="#fffdf8" stroke="#dfd8cc"/><rect x="504" y="723" width="7" height="30" rx="3" fill="#6b4c35" stroke="none"/><text x="523" y="746" font-size="20" fill="#302c29" font-weight="600">皮革书卷</text><rect x="702" y="703" width="199" height="71" rx="10" fill="#fffdf8" stroke="#dfd8cc"/><rect x="716" y="723" width="7" height="30" rx="3" fill="#69a5bd" stroke="none"/><text x="735" y="746" font-size="20" fill="#302c29" font-weight="600">鲸游·知识海</text><rect x="914" y="703" width="199" height="71" rx="10" fill="#fffdf8" stroke="#dfd8cc"/><rect x="928" y="723" width="7" height="30" rx="3" fill="#859cbe" stroke="none"/><text x="947" y="746" font-size="20" fill="#302c29" font-weight="600">日系手账</text><rect x="1126" y="703" width="199" height="71" rx="10" fill="#fffdf8" stroke="#dfd8cc"/><rect x="1140" y="723" width="7" height="30" rx="3" fill="#4c5e91" stroke="none"/><text x="1159" y="746" font-size="20" fill="#302c29" font-weight="600">月光玻璃</text><rect x="1338" y="703" width="199" height="71" rx="10" fill="#fffdf8" stroke="#dfd8cc"/><rect x="1352" y="723" width="7" height="30" rx="3" fill="#416dba" stroke="none"/><text x="1371" y="746" font-size="20" fill="#302c29" font-weight="600">像素桌面</text><text x="68" y="815" font-size="12" fill="#776e65" letter-spacing="2">为真正的理解而写，为下一次回看而留。</text></g></svg>
