<template id="reader-pixel">
<section class="reader-scene studio pixel-studio" aria-label="像素桌面" data-screen="desktop" data-file-open="false">
 <header class="pixel-brand"><strong>YAMADA RYO</strong><span>笔记系统 v1.0</span></header>
 <nav class="pixel-desktop-icons" aria-label="桌面"><button data-studio-action="shelf" class="pixel-notes-icon"><i class="pixel-folder-icon" aria-hidden="true"></i>我的笔记</button><div class="pixel-file-icons" hidden><button data-scene-action="overview"><i class="pixel-study-icon" aria-hidden="true">✓</i>学习</button><button data-scene-panel="notes"><i class="pixel-document-icon" aria-hidden="true">≡</i>正文</button><button data-scene-panel="map"><i class="pixel-map-icon" aria-hidden="true">♧</i>导图</button><button data-scene-panel="markdown"><i class="pixel-document-icon" aria-hidden="true">M↓</i>Markdown</button><button data-scene-panel="transcript"><i class="pixel-source-icon" aria-hidden="true">↗</i>出处</button></div></nav>
 <section class="pixel-window pixel-main-window" data-window="notes" hidden>
  <header class="pixel-titlebar"><strong>▣ <span class="pixel-window-title">我的笔记</span></strong><div><button data-window-action="minimize" aria-label="最小化笔记窗口">_</button><button data-window-action="maximize" aria-label="最大化笔记窗口">□</button><button data-window-action="close" aria-label="关闭笔记窗口">×</button></div></header>
  <nav class="pixel-menubar"><button data-studio-action="shelf">文件(F)</button><button data-studio-action="desktop">桌面(D)</button><button data-studio-action="export" class="pixel-note-only">导出(E)</button><button data-studio-action="print" class="pixel-note-only">打印(P)</button></nav>
  <div class="pixel-commandbar"><button data-studio-action="desktop" aria-label="返回桌面">⌂</button><button data-studio-action="shelf" aria-label="返回我的笔记文件夹">▰</button><label class="studio-search"><span>⌕</span><input type="search" class="shelf-search" placeholder="搜索笔记文件…" aria-label="搜索我的笔记"></label></div>
  <div class="pixel-addressbar">地址 <span class="pixel-address">我的电脑 / 我的笔记</span></div>
  <div class="pixel-window-content"><aside class="studio-sidebar"><div class="pixel-folder-label">▰ 我的笔记</div><p class="pixel-folder-help">打开一个笔记文件，<br>开始自己的学习。</p><div class="pixel-note-only"><span class="studio-small">本篇章节</span><div class="sidebar-chapters"></div></div></aside><div class="studio-main">
   <section class="studio-shelf" hidden><div class="pixel-folder-heading"><h1>我的笔记</h1><span><b class="shelf-count"></b> 个文件</span></div><div class="shelf-cards all-cards"></div><p class="shelf-empty" hidden>没有找到匹配的笔记文件。</p></section>
   <section class="studio-reading" hidden><nav class="pixel-format-bar" aria-label="笔记内容"><button data-scene-action="overview"><span>✓</span>学习</button><button data-scene-panel="notes"><span>▤</span>正文</button><button data-scene-panel="map"><span>♧</span>导图</button><button data-scene-panel="markdown"><span>M↓</span>Markdown</button><button data-scene-panel="transcript"><span>↗</span>出处</button></nav><div class="scene-reader-body"><div data-slot="heading"></div><div data-slot="panels"></div></div></section>
  </div></div><footer class="pixel-statusbar"><span class="pixel-file-status">选择一个笔记文件</span><span class="scene-position pixel-note-only"></span><span>UTF-8</span></footer>
 </section>
 <aside class="pixel-window pixel-outline-window" data-window="outline" hidden><header class="pixel-titlebar"><strong>☑ 学习目录</strong><div><button data-window-action="minimize" aria-label="最小化目录窗口">_</button></div></header><div class="outline-chapters"></div></aside>
 <footer class="pixel-taskbar"><button class="pixel-start" data-studio-action="desktop">▦ 开始</button><button data-window-restore="notes" hidden>▰ 我的笔记</button><button data-window-restore="outline" hidden>☑ 学习目录</button><span class="pixel-taskbar-status">SEAGULL NOTES ✿</span></footer>
 <div class="scene-index" hidden><header><span>查找章节</span><button data-scene-action="close-index" aria-label="关闭章节查找">×</button></header><div data-slot="index"></div></div><div data-slot="formats" hidden></div>
</section>
</template>
