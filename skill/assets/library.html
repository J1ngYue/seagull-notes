<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>笔记夹 · Seagull Notes</title>
<style>
:root{--paper:#fffefa;--bg:#f5f3ed;--ink:#3b332a;--muted:#776b5f;--line:#e7dccb;--green:#785c42;--accent:#a55c43}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.8 "Microsoft YaHei",system-ui,sans-serif}a{color:inherit}button,input{font:inherit}a:focus-visible,input:focus-visible{outline:3px solid #bda27f;outline-offset:4px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px max(24px,5vw);border-bottom:1px solid var(--line);background:var(--paper)}.brand{display:flex;align-items:center;gap:12px;font-size:13px;font-weight:700;letter-spacing:1.5px}.brand svg{width:28px;height:28px;color:var(--green)}.local-label{color:var(--muted);font-size:12px}
main{max-width:1190px;margin:0 auto;padding:48px 32px 70px}.shelf-head{display:flex;justify-content:space-between;align-items:center;gap:30px;margin-bottom:32px}.eyebrow{font-size:10px;letter-spacing:3px;color:var(--accent);font-weight:700}h1{font-size:38px;line-height:1.4;margin:10px 0 12px;letter-spacing:-.8px}.intro{color:var(--muted);margin:0;font-size:14px}.shelf-count{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:112px;min-height:112px;border:1px solid var(--line);border-radius:24px;background:#f8f1e7}.shelf-count strong{font:italic 42px Georgia,serif;color:var(--green);line-height:1.25}.shelf-count span{font-size:11px;color:var(--muted)}
h1 span{white-space:nowrap}
.note-entry{display:flex;flex-direction:column;min-width:0}.note-entry[hidden]{display:none}.note-entry .note-card{flex:1}.obsidian-download{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 5px 0;min-height:36px;font-size:11px;color:var(--green);text-decoration:none;border-radius:6px;padding:5px 8px}.obsidian-download:hover{background:#f0e3cf}.obsidian-download span:last-child{font-size:10px;color:var(--muted)}.bulk-export{display:inline-block;font-size:11px;color:var(--green);text-decoration:none;padding:5px 0}.bulk-export:hover{text-decoration:underline}
.card-labels{display:flex;align-items:center;justify-content:space-between;gap:8px}.style-label{font-size:10px;color:var(--muted)}.shelf-filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 22px}.shelf-filters button{border:1px solid #e1d3bd;background:#fffefa;border-radius:20px;padding:7px 14px;color:#776b5f;font-size:11px;cursor:pointer;min-height:36px}.shelf-filters button[aria-pressed=true]{background:#f5ecdc;border-color:#bda27f;color:#785c42}.search-row{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:19px 0;border-top:1px solid var(--line);margin-bottom:18px}.section-label{font-size:13px;font-weight:600;color:var(--green)}.search-box{display:flex;align-items:center;gap:10px;width:min(350px,100%);height:42px;padding:0 13px;border:1px solid #e1d3bd;background:var(--paper);border-radius:10px}.search-box svg{width:17px;height:17px;fill:none;stroke:#907456;stroke-width:1.6}.search-box input{width:100%;min-width:0;border:0;background:transparent;color:var(--ink);font-size:12px;outline:none}.search-box:focus-within{outline:2px solid #bda27f;outline-offset:2px}
.note-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:23px}.note-card{display:flex;flex-direction:column;min-width:0;border:1px solid var(--line);border-radius:17px;overflow:hidden;background:var(--paper);text-decoration:none;box-shadow:0 5px 22px #51392205;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s;animation:card-enter .4s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:var(--delay)}.note-card:hover{transform:translateY(-4px);box-shadow:0 13px 30px #51392212;border-color:#cbb596}.note-card[hidden]{display:none}.card-cover{height:183px;background:#f8f1e7;overflow:hidden;border-bottom:1px solid var(--line)}.card-cover img{display:block;width:100%;height:100%;object-fit:cover}.card-cover img.diagram{object-fit:contain;padding:12px}.cover-placeholder{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}.cover-placeholder span{font:italic 56px Georgia,serif;color:#9a8062}.cover-placeholder small{font-size:11px;color:var(--muted)}
.card-body{display:flex;flex-direction:column;flex:1;padding:23px 23px 20px}.platform{align-self:flex-start;font-size:10px;letter-spacing:.5px;color:#907456;border:1px solid #e1d3bd;background:#fcf7ee;padding:2px 9px;border-radius:20px}.card-body h2{font-size:19px;line-height:1.65;margin:12px 0 10px}.card-body p{font-size:12px;line-height:1.95;color:var(--muted);margin:0 0 22px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}.card-foot{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:auto;border-top:1px solid var(--line);padding-top:15px;font-size:11px;color:var(--muted)}.read-label{display:flex;align-items:center;gap:7px;color:var(--green);white-space:nowrap}.read-label svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.5;transition:transform .25s}.note-card:hover .read-label svg{transform:translateX(3px)}.empty{padding:60px 20px;text-align:center;color:var(--muted);border:1px dashed #ddcfba;border-radius:15px;background:#fcf8f0}.empty[hidden]{display:none}footer{margin-top:38px;color:var(--muted);font-size:11px;display:flex;justify-content:space-between;gap:20px}
@keyframes card-enter{from{opacity:0;transform:translateY(13px)}to{opacity:1;transform:translateY(0)}}@keyframes shelf-enter{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}.shelf-head,.search-row{animation:shelf-enter .35s ease-out both}
@media(max-width:650px){.topbar{padding:15px 20px}.brand{font-size:11px;letter-spacing:1px}.local-label{font-size:11px}main{padding:29px 20px 45px}.shelf-head{gap:18px;margin-bottom:24px}.shelf-count{min-width:77px;min-height:88px;border-radius:18px}.shelf-count strong{font-size:34px}h1{font-size:29px}.intro{font-size:12px}.search-row{flex-direction:column;align-items:stretch;gap:13px}.search-box{width:100%;height:44px}.note-grid{grid-template-columns:1fr;gap:18px}.card-body{padding:20px}.card-body h2{font-size:18px}.card-cover{height:190px}footer{font-size:10px}}
@media(prefers-reduced-motion:reduce){.note-card,.shelf-head,.search-row{animation:none!important}.note-card,.read-label svg{transition:none!important}}
</style>
</head>
<body>
<header class="topbar"><div class="brand"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M3 18c5-6 10-7 13-1 3-6 8-5 13 1M10 23c4 2 8 2 12 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>SEAGULL NOTES</div><span class="local-label">我的笔记夹</span></header>
<main>
<section class="shelf-head"><div><div class="eyebrow">YOUR READING SHELF</div><h1>把理解，<span>留在这里。</span></h1><p class="intro">每一次认真读过的内容，都有一个可以回来的地方。</p></div><div class="shelf-count"><strong>$count</strong><span>篇学习笔记</span></div></section>
<div class="search-row"><span class="section-label" id="visible-count" role="status" aria-live="polite">全部笔记 · $count 篇</span><label class="search-box"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 5 5"/></svg><input id="search-notes" type="search" aria-label="搜索笔记" placeholder="搜索标题、摘要、标签或来源"></label></div>
<nav class="shelf-filters" aria-label="来源筛选"><button type="button" data-kind="all" aria-pressed="true">全部</button><button type="button" data-kind="topic" aria-pressed="false">主题知识</button><button type="button" data-kind="text" aria-pressed="false">文本整理</button><button type="button" data-kind="article" aria-pressed="false">网页笔记</button><button type="button" data-kind="video" aria-pressed="false">视频精读</button><button type="button" data-kind="local" aria-pressed="false">本地素材</button></nav>
<section class="note-grid" aria-label="笔记列表">$cards</section>
<p class="empty" id="empty" hidden>当前筛选下没有笔记，可换个分类或关键词。</p>
<footer><span>新笔记会自动收录在这里。<br><a class="bulk-export" href="Seagull-Notes-Obsidian.zip" download>全部导出到 Obsidian ↓</a></span><span>Watch with curiosity. Keep with clarity.</span></footer>
</main>
<script>
const cards=Array.from(document.querySelectorAll('.note-card')),search=document.getElementById('search-notes');
let selectedKind='all';const sourceFilters=Array.from(document.querySelectorAll('.shelf-filters button'));sourceFilters.forEach(button=>button.addEventListener('click',()=>{selectedKind=button.dataset.kind;sourceFilters.forEach(item=>item.setAttribute('aria-pressed',String(item===button)));filterNotes()}));
function filterNotes(){const query=search.value.trim().toLowerCase();let visible=0;cards.forEach(card=>{card.hidden=!card.dataset.search.toLowerCase().includes(query)||(selectedKind!=='all'&&card.dataset.kind!==selectedKind);if(card.parentElement.classList.contains('note-entry'))card.parentElement.hidden=card.hidden;if(!card.hidden)visible++});const label=query?'匹配笔记':selectedKind==='all'?'全部笔记':sourceFilters.find(button=>button.dataset.kind===selectedKind).textContent;document.getElementById('visible-count').textContent=label+' · '+visible+' 篇';document.getElementById('empty').hidden=visible>0}
search.addEventListener('input',filterNotes);search.addEventListener('keydown',event=>{if(event.key==='Escape'){search.value='';filterNotes()}});filterNotes();
</script>
</body>
</html>
