interface:
  display_name: "Seagull Notes"
  short_description: "Interactive notes from topics, text, webpages and videos"
  default_prompt: "Use $seagull-notes to turn this topic or material into complete illustrated Chinese notes. Read and verify the sources, choose a suitable reading style, include useful visualizations and review cards, and add the result to my notebook shelf. Reuse sign-in for captioned videos when needed."
policy:
  allow_implicit_invocation: true
